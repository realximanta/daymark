apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ximanta.opendiary'
    compileSdk 34

    defaultConfig {
        applicationId "com.ximanta.opendiary"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "2.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            // All Kotlin (and any stray .java) lives here.
            kotlin.srcDirs = ['src/main/kotlin']
            java.srcDirs = ['src/main/kotlin']
            res.srcDirs = ['src/main/res']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

// No external dependencies. The app intentionally uses only:
//   - Android framework (android.*, org.json.*, java.net.*, java.text.*)
//   - Kotlin stdlib (provided by the Kotlin Gradle plugin / build.sh)
// This keeps the fallback build.sh pipeline working without a
// dependency resolver. Add deps here only if you migrate to a
// standard Gradle build environment.
dependencies {
}
