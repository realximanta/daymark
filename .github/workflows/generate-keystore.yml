name: Generate Daymark Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate standard debug keystore
        run: |
          mkdir -p out
          keytool -genkeypair \
            -keystore out/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Encode as base64
        run: |
          base64 -w 0 out/debug.keystore > out/keystore.b64
          echo "=========== COPY THE LINE BELOW ==========="
          cat out/keystore.b64
          echo ""
          echo "=========== END ==========="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daymark-keystore
          path: out/
          retention-days: 30
